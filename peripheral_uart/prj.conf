# ================= UART / CONSOLE =================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_ASYNC_API=y
CONFIG_NRFX_UARTE0=y

# ================= GPIO =================
CONFIG_GPIO=y

# ================= Memory =================
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ================= Bluetooth Low Energy (BLE) =================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="left_insole"
CONFIG_BT_NUS=y

# ================= Bluetooth Settings & Storage =================
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# ================= DK Library (Buttons/LEDs) =================
CONFIG_DK_LIBRARY=y

# ================= Logging (RTT Backend) =================
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_ASSERT=y

# ================= MCUboot & MCUmgr (DFU/OTA) =================
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IS_BOOTLOADER=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_LOG_LEVEL_DBG=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# ================= Sensors - I2C =================
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME680=y
CONFIG_BH1749=y
CONFIG_BH1749_TRIGGER=y

# ================= Sensors - SPI (ADXL362) =================
CONFIG_SPI_RTIO=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_ADXL362_STREAM=y
CONFIG_ADXL362_ACCEL_ODR_400=y

# ================= Build Configuration =================
CONFIG_BUILD_OUTPUT_META=n
